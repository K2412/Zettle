name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # sqlite-vec is hard-required (ADR-0003): fetch the loadable vec0 extension
      # so migrations can create the note_embeddings vec0 table and KNN tests run.
      - name: Install sqlite-vec extension
        env:
          SQLITE_VEC_VERSION: '0.1.6'
        run: |
          mkdir -p database/extensions
          curl -fsSL \
            "https://github.com/asg017/sqlite-vec/releases/download/v${SQLITE_VEC_VERSION}/sqlite-vec-${SQLITE_VEC_VERSION}-loadable-linux-x86_64.tar.gz" \
            | tar -xz -C database/extensions
          test -f database/extensions/vec0.so

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
